[package]
name = "eve-multibox"
version = "0.4.1"
edition = "2024"
description = "Kostenloses, EULA-konformes Multibox-Werkzeug für EVE Online (Windows & Linux) – ohne Input-Broadcasting"
authors = ["LeggaSchnegge"]
license = "MIT"
publish = false

# Reine Logik (Konfiguration, Hotkey-Parser, Layout-Planung) liegt in einer
# Bibliothek ohne Win32-Abhängigkeit – dadurch auch unter WSL/Linux testbar.
[lib]
name = "evemb"
path = "src/lib.rs"

[[bin]]
name = "eve-multibox"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux: Fensterverwaltung über X11/XWayland, Prozesse über /proc und libc,
# Tray-Symbol über StatusNotifierItem (KDE, GNOME mit AppIndicator-Erweiterung, Xfce …).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
x11rb = { version = "0.13", features = ["composite", "randr", "render"] }
libc = "0.2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Geglättete Schrift in den Vorschau-Titelzeilen (Ubuntu-Schrift aus den egui-Standardschriften).
ab_glyph = "0.2"
epaint_default_fonts = "0.36"

# Nur beim Bauen unter Windows (MSVC, GitHub Actions): Ressourcen-Compiler für Icon/Versionsinfo.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Der zig-Linker (cargo-zigbuild, Linux-Release) meldet harmlos „ignoring deprecated linker
# optimization setting "1"“ – das ist keine Warnung zum Code, daher ausgeblendet.
[lints.rust]
linker_messages = "allow"
