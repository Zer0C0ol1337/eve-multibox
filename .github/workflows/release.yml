# Baut beim Veröffentlichen eines GitHub-Releases automatisch beide Programme und hängt sie an:
#   eve-multibox-<version>-windows-x64.zip     (unter Windows mit MSVC gebaut – seltener Fehlalarme
#                                                als MinGW-Builds; signiert über SignPath, sobald eingerichtet)
#   eve-multibox-<version>-linux-x86_64.tar.gz (cargo-zigbuild gegen glibc 2.31)
#
# Signieren (kostenlos für Open Source über die SignPath Foundation, siehe docs/SIGNING.md):
#   Repository-Variable SIGNPATH_ORGANIZATION_ID + Secret SIGNPATH_API_TOKEN setzen – dann wird die .exe
#   vor dem Verpacken signiert. Ohne diese Einstellungen wird unsigniert gebaut (wie bisher).
#
# Ablauf: Releases → „Draft a new release“ → Tag vX.Y.Z (muss zur Version in Cargo.toml passen)
# → „Publish release“. Nach einigen Minuten erscheinen die Dateien unter „Assets“.
# Alternativ unter „Actions“ → „Release-Dateien bauen“ → „Run workflow“ mit dem Tag starten.

name: Release-Dateien bauen

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag des Releases (z. B. v0.4.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  CARGO_TERM_COLOR: always

jobs:
  # Prüft, dass Tag und Version in Cargo.toml übereinstimmen – alles auf einem Nenner.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag gegen Cargo.toml prüfen
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $version in Cargo.toml"
            exit 1
          fi
          echo "Version $version ✔"

  # Unit-Tests (Bibliothek + Linux-Backend) vor dem Bauen.
  check:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: |
          cargo test --lib --target x86_64-unknown-linux-gnu
          cargo test --bin eve-multibox --target x86_64-unknown-linux-gnu

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WIN_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - name: Windows-.exe bauen (MSVC)
        run: |
          cargo build --release --target "$WIN_TARGET"
          mkdir -p dist
          cp "target/$WIN_TARGET/release/eve-multibox.exe" dist/

      # --- Signieren über SignPath (nur wenn eingerichtet) ---
      - name: Unsignierte .exe für SignPath bereitstellen
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eve-multibox-unsigned
          path: dist/eve-multibox.exe
          if-no-files-found: error
      - name: Signieren lassen (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'eve-multibox' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed
      - name: Signierte .exe übernehmen
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: cp dist/signed/eve-multibox.exe dist/eve-multibox.exe

      - name: Windows-ZIP verpacken
        run: bash scripts/dev.sh package-windows
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/eve-multibox-*-windows-x64.zip --clobber

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: zig + cargo-zigbuild installieren
        run: |
          python3 -m pip install --user --break-system-packages ziglang
          cargo install --locked cargo-zigbuild
      - name: Linux-Paket bauen
        run: scripts/dev.sh linux
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/eve-multibox-*-linux-x86_64.tar.gz --clobber
